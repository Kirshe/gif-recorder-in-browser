<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- App tile background: deep indigo -> violet -->
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B2D6E"/>
      <stop offset="0.55" stop-color="#5B2A9D"/>
      <stop offset="1" stop-color="#7C2D8A"/>
    </linearGradient>
    <!-- Glossy record-dot gradient -->
    <radialGradient id="rec" cx="0.35" cy="0.30" r="0.85">
      <stop offset="0" stop-color="#FF8A7A"/>
      <stop offset="0.45" stop-color="#FF4438"/>
      <stop offset="1" stop-color="#D31021"/>
    </radialGradient>
    <!-- Soft top sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded app tile -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#sheen)"/>
  <rect x="6.75" y="6.75" width="114.5" height="114.5" rx="27.25" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Film-strip motion frames sweeping behind the dot -->
  <g opacity="0.9">
    <rect x="20" y="40" width="13" height="13" rx="3" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="20" y="58" width="13" height="13" rx="3" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="20" y="76" width="13" height="13" rx="3" fill="#ffffff" fill-opacity="0.16"/>
  </g>

  <!-- Motion trail arcs (the GIF "loops") -->
  <g stroke-linecap="round" fill="none">
    <path d="M44 30 A38 38 0 0 1 98 30" stroke="#ffffff" stroke-opacity="0.30" stroke-width="4"/>
    <path d="M98 98 A38 38 0 0 1 44 98" stroke="#ffffff" stroke-opacity="0.30" stroke-width="4"/>
    <!-- loop arrowheads -->
    <path d="M98 30 l1 -9 l-8 4 z" fill="#ffffff" fill-opacity="0.42" stroke="none"/>
    <path d="M44 98 l-1 9 l8 -4 z" fill="#ffffff" fill-opacity="0.42" stroke="none"/>
  </g>

  <!-- Central record dot -->
  <circle cx="71" cy="64" r="26" fill="url(#rec)" filter="url(#ds)"/>
  <circle cx="71" cy="64" r="26" stroke="#ffffff" stroke-opacity="0.30" stroke-width="2"/>
  <!-- specular highlight -->
  <ellipse cx="62" cy="54" rx="11" ry="8" fill="#ffffff" fill-opacity="0.30"/>

  <!-- GIF wordmark chip -->
  <g>
    <rect x="46" y="92" width="36" height="18" rx="6" fill="#0E0F26" fill-opacity="0.55"/>
    <text x="64" y="105.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="13" letter-spacing="1" fill="#ffffff">GIF</text>
  </g>
</svg>
