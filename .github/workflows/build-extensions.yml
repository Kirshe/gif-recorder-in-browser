name: Build extensions

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build Chrome
        run: npm run build:chrome

      - name: Build Firefox
        run: npm run build:firefox
        env:
          FIREFOX_ADDON_ID: ${{ secrets.FIREFOX_ADDON_ID }}

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package Chrome
        run: cd dist/chrome && zip -r "../../gif-recorder-chrome-v${{ steps.version.outputs.version }}.zip" . && cd ../..

      - name: Package Firefox
        run: cd dist/firefox && zip -r "../../gif-recorder-firefox-v${{ steps.version.outputs.version }}.zip" . && cd ../..

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v5
        with:
          name: gif-recorder-chrome
          path: gif-recorder-chrome-v${{ steps.version.outputs.version }}.zip

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v5
        with:
          name: gif-recorder-firefox
          path: gif-recorder-firefox-v${{ steps.version.outputs.version }}.zip

      - name: Attach packages to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gif-recorder-chrome-v${{ steps.version.outputs.version }}.zip
            gif-recorder-firefox-v${{ steps.version.outputs.version }}.zip
